name: Frontend review checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/food-discovery-cart-polish-2026]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps > qa-install.log 2>&1
          result=$?
          cat qa-install.log
          exit $result
      - name: TypeScript diagnostics
        id: typescript
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          npx tsc --noEmit -p tsconfig.app.json > qa-typescript.log 2>&1
          result=$?
          cat qa-typescript.log
          exit $result
      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          npm run build > qa-build.log 2>&1
          result=$?
          cat qa-build.log
          exit $result
      - name: Unit tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          npm test > qa-tests.log 2>&1
          result=$?
          cat qa-tests.log
          exit $result
      - name: Lint (legacy code diagnostics)
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          npm run lint > qa-lint.log 2>&1
          result=$?
          cat qa-lint.log
          exit $result
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-qa-logs
          path: qa-*.log
          if-no-files-found: warn
      - name: Enforce build and tests
        if: always()
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          echo "Install: $INSTALL | Build: $BUILD | Tests: $TESTS"
          test "$INSTALL" = success && test "$BUILD" = success && test "$TESTS" = success
