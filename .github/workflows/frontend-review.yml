name: Frontend review checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [refresh/editorial-restaurant-ux-2026]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
