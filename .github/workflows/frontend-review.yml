name: Frontend review checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [refresh/editorial-restaurant-ux-2026]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        # package-lock.json predates the PWA/auth additions, so npm ci is not usable yet.
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Check TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Lint (legacy code diagnostics)
        run: npm run lint
        continue-on-error: true
